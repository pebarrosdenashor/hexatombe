<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cutscenes do Hexatombe</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@400;700&family=Alegreya+Sans:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#14171a;--panel:#1b1f22;--line:#4a463a;--ink:#e6dcc4;--dim:#a69e89;--accent:#d4a63c;--blood:#b23a2e;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Alegreya Sans",system-ui,sans-serif}
  .app{padding:14px;display:grid;gap:12px}
  .eyebrow{font:.68rem "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  h1{font-family:"Alegreya SC",Georgia,serif;font-size:1.45rem;margin:2px 0 0;line-height:1.05}
  .cena{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blood);border-radius:3px;padding:12px;display:grid;gap:8px}
  .cena h2{font-family:"Alegreya SC",Georgia,serif;font-size:1.1rem;margin:0}
  .cena p{margin:0;color:var(--dim);font-size:.92rem}
  .acoes{display:flex;gap:6px;flex-wrap:wrap}
  button{font:inherit;color:inherit;background:#22272b;border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.prim{background:var(--blood);border-color:var(--blood);color:#f4efe2}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mini{font-size:.8rem;color:var(--dim)}
  .rodape{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #lista{display:grid;gap:10px}
  .grupo{margin-top:6px}
  .aviso{border:1px dashed var(--line);padding:14px;border-radius:3px;color:var(--dim);text-align:center}
</style></head>
<body><div class="app">
  <div><div class="eyebrow">Hexatombe</div><h1>Cutscenes</h1></div>
  <div id="lista"></div>
  <div class="rodape" id="rodape" hidden><span class="mini">Cada jogador clica para começar (precisa do clique para liberar o som).</span><button id="parar">Fechar para todos</button></div>
</div>
<script type="module" src="painel.js?v=1.2.0"></script>
</body></html>
